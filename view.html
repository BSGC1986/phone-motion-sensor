<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Games — Live View</title>
<style>
  :root { --bg: #0b0d12; --card: #151922; --line: #2a2f3a; --text: #f1f3f8; --muted: #8a92a3; --good: #4cd37b; --bad: #ff6b6b; --ga: #ffb547; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, sans-serif; overflow: hidden; cursor: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  #vGame { height: 100%; display: flex; flex-direction: column; padding: 2vh 2vw; gap: 2vh; }
  #vHead { text-align: center; }
  #vTitle { font-size: clamp(1.4rem, 4vh, 3rem); font-weight: 800; color: var(--ga); }
  #vClock { text-align: center; border-radius: 16px; padding: 1vh 0; }
  #vClock[data-mood=go] { background: linear-gradient(#173325, transparent); }
  #vClock[data-mood=ice] { background: linear-gradient(#10324d, transparent); }
  #vTimer { font-size: clamp(3rem, 14vh, 9rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #vSub { color: var(--muted); font-size: clamp(1rem, 2.6vh, 1.8rem); min-height: 1.3em; }
  #vPill { display: inline-block; padding: 2px 14px; border-radius: 99px; background: #262b36; font-size: clamp(.8rem, 2vh, 1.2rem); }
  #vPill.running { background: #1d3b2a; color: var(--good); }
  #vPill.armed { background: #3b3216; color: var(--ga); }
  #vPill.finished { background: #3b1d1d; color: var(--bad); }

  #vTeams { flex: 1; min-height: 0; display: grid; gap: 1.6vh 1.4vw; grid-template-columns: 1fr; align-content: start; }
  #vTeams[data-n="2"], #vTeams[data-n="3"], #vTeams[data-n="4"] { grid-template-columns: 1fr 1fr; }
  #vTeams[data-n="5"], #vTeams[data-n="6"], #vTeams[data-n="7"], #vTeams[data-n="8"] { grid-template-columns: 1fr 1fr 1fr; }
  .vt { background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--tc); border-radius: 16px; padding: 1vh 1vw; display: flex; flex-direction: column; gap: .4vh; min-height: 0; }
  .vt.win { border-color: var(--ga); box-shadow: 0 0 0 3px var(--ga) inset; }
  .vt.off { opacity: .5; }
  .vn { font-size: clamp(1.1rem, 3vh, 2rem); font-weight: 800; color: var(--tc); }
  .vt canvas { width: 100%; height: 30vh; display: block; border-radius: 10px; background: #12161d; }
  #vTeams[data-n="1"] canvas { height: 42vh; }
  #vTeams[data-n="2"] canvas { height: 38vh; }
  #vTeams[data-n="3"] canvas, #vTeams[data-n="4"] canvas { height: 21vh; }
  #vTeams[data-n="5"] canvas, #vTeams[data-n="6"] canvas { height: 17vh; }
  #vTeams[data-n="7"] canvas, #vTeams[data-n="8"] canvas { height: 14vh; }
  .vs { font-size: clamp(2.2rem, 8vh, 6rem); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .vs.small { font-size: clamp(1.6rem, 5vh, 3.4rem) !important; }
  #vTeams[data-n="3"] .vs, #vTeams[data-n="4"] .vs { font-size: clamp(2rem, 6vh, 4rem); }
  #vTeams[data-n="5"] .vs, #vTeams[data-n="6"] .vs, #vTeams[data-n="7"] .vs, #vTeams[data-n="8"] .vs { font-size: clamp(1.6rem, 4.5vh, 3rem); }
  .vsub { text-align: center; color: var(--muted); font-size: clamp(.8rem, 1.9vh, 1.2rem); }

  /* waiting screen */
  #vHome { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; }
  #vHome h1 { font-size: clamp(2.5rem, 10vh, 6rem); margin: 0; }
  #vChips { display: flex; flex-wrap: wrap; gap: 1.2vh 1.2vw; justify-content: center; max-width: 80vw; }
  .chip { padding: .8vh 1.6vw; border-radius: 99px; border: 3px solid var(--tc); font-size: clamp(1.2rem, 4vh, 2.4rem); font-weight: 700; }

  /* tournament break */
  #vBreak { position: fixed; inset: 0; background: radial-gradient(circle at 50% 10%, color-mix(in srgb, var(--ga) 20%, #0b0d12), #0b0d12 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; padding: 3vh 5vw; overflow: auto; text-align: center; }
  .bk-top { font-size: clamp(1rem, 3vh, 2rem); color: var(--muted); font-weight: 700; }
  .bk-next { display: flex; align-items: center; gap: 2vw; padding: 2vh 2.4vw; border-radius: 20px; border: 2px solid var(--ga); background: linear-gradient(120deg, color-mix(in srgb, var(--ga) 28%, #151922), #151922 70%); text-align: left; }
  .bk-e { font-size: clamp(3rem, 12vh, 8rem); line-height: 1; }
  .bk-t { font-size: clamp(1.6rem, 6vh, 4rem); font-weight: 800; } .bk-b { color: #c3c9d6; font-size: clamp(1rem, 2.6vh, 1.8rem); }
  .bk-count { font-size: clamp(5rem, 24vh, 15rem); font-weight: 800; line-height: .95; color: var(--ga); font-variant-numeric: tabular-nums; }
  .bk-count small { display: block; font-size: clamp(1rem, 3vh, 2rem); color: var(--muted); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .bk-warn { color: #ff8a8a; font-weight: 800; font-size: clamp(1.1rem, 3.4vh, 2.2rem); }
  .bk-board { width: min(900px, 100%); } .bk-last { font-size: clamp(1.1rem, 3.4vh, 2.2rem); font-weight: 800; margin-bottom: 1vh; }
  table.board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .board td { padding: 1vh 1vw; border-top: 1px solid var(--line); text-align: right; font-size: clamp(1.1rem, 3.4vh, 2.2rem); }
  .board td:first-child { text-align: center; width: 2.4em; }
  .board .tn2 { text-align: left; font-weight: 800; color: var(--tc); } .board .tot { font-weight: 800; } .board small { color: var(--good); font-size: .6em; }

  /* results */
  #vResults { position: fixed; inset: 0; background: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--ga) 22%, #0b0d12), #0b0d12 70%); display: flex; flex-direction: column; align-items: center; padding: 5vh 5vw; gap: 3vh; overflow: auto; }
  #vResTitle { font-size: clamp(1.6rem, 5vh, 3.4rem); font-weight: 800; color: var(--ga); text-align: center; }
  #vBanner { font-size: clamp(2rem, 8vh, 5.5rem); font-weight: 800; text-align: center; line-height: 1.1; }
  #vList { list-style: none; padding: 0; margin: 0; width: min(1000px, 100%); display: grid; gap: 1.4vh; }
  #vList li { display: grid; grid-template-columns: 1.6em 1fr auto; grid-template-areas: "rk rn rsc" ". rsub rsub"; align-items: center; gap: 0 1.4vw;
              background: var(--card); border-left: 14px solid var(--tc); border-radius: 14px; padding: 1.4vh 1.6vw; }
  #vList li:first-child { background: linear-gradient(90deg, color-mix(in srgb, var(--ga) 30%, #151922), #151922); transform: scale(1.03); }
  #vList li.dim { opacity: .5; }
  .rk { grid-area: rk; font-size: clamp(1.8rem, 6vh, 3.6rem); }
  .rn { grid-area: rn; font-size: clamp(1.4rem, 5vh, 3rem); font-weight: 800; color: var(--tc); }
  .rsc { grid-area: rsc; font-size: clamp(1.6rem, 6vh, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .rsub { grid-area: rsub; color: var(--muted); font-size: clamp(.8rem, 2vh, 1.3rem); }
</style>
</head>
<body>
<div id="vHome">
  <h1>🎮 Motion Games</h1>
  <div class="muted" style="font-size:clamp(1rem,3vh,2rem)">Waiting for the host to pick a game…</div>
  <div id="vChips"></div>
</div>

<div id="vGame" class="hidden">
  <div id="vHead"><div id="vTitle"></div></div>
  <div id="vClock"><div id="vTimer">0:00.0</div><div id="vSub"></div><span id="vPill">ready</span></div>
  <div id="vTeams"></div>
</div>

<div id="vBreak" class="hidden"></div>

<div id="vResults" class="hidden">
  <div id="vResTitle"></div>
  <div id="vBanner"></div>
  <ol id="vList"></ol>
</div>
</body>
</html>
